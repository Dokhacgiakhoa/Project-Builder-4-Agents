<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hcCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="hcCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Score Center Radial -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="hcGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.25" />
    </pattern>

    <filter id="hcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="480" rx="16" fill="url(#hcCanvasBg)" />
  <rect width="1100" height="480" rx="16" fill="url(#hcGrid)" />
  <rect width="1100" height="480" rx="16" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Center Glow -->
  <circle cx="550" cy="240" r="220" fill="url(#centerGlow)" filter="url(#hcGlow)" />

  <!-- Title Header -->
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" stroke-opacity="0.8" />
    <circle cx="14" cy="13" r="4" fill="#34d399" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1">
      7 STATIC PILLARS
    </text>
    <text x="195" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">
      Project Builder Analytics Heuristic Guardrail Framework
    </text>
    <text x="750" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
      0 External Tokens • Letter Grades A+ to F • Python 3.12+ / Single EXE
    </text>
  </g>

  <!-- Connecting Lines from Center to Pillars -->
  <!-- Left Side Lines -->
  <line x1="430" y1="210" x2="350" y2="135" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="415" y1="240" x2="350" y2="240" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="430" y1="270" x2="350" y2="345" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Right Side Lines -->
  <line x1="670" y1="200" x2="750" y2="115" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="680" y1="230" x2="750" y2="195" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="680" y1="260" x2="750" y2="280" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="670" y1="285" x2="750" y2="365" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- ==================== LEFT PILLARS (1, 2, 3) ==================== -->
  <g transform="translate(50, 85)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="300" height="74" rx="10" fill="url(#hcCardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <rect width="4" height="74" rx="2" fill="#38bdf8" />
      <text x="18" y="28" font-size="18">📁</text>
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
        Pillar 1: Project Structure
      </text>
      <text x="250" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">
        PASS [20]
      </text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
        Tree layout, file counts, no rogue dirs (DIR-*)
      </text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(0, 105)">
      <rect width="300" height="74" rx="10" fill="url(#hcCardBg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <rect width="4" height="74" rx="2" fill="#818cf8" />
      <text x="18" y="28" font-size="18">🔒</text>
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
        Pillar 2: Git Hygiene &amp; Secrets
      </text>
      <text x="250" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">
        PASS [15]
      </text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
        .gitignore coverage, uncommitted bloat, SEC-*
      </text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(0, 210)">
      <rect width="300" height="74" rx="10" fill="url(#hcCardBg)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
      <rect width="4" height="74" rx="2" fill="#c084fc" />
      <text x="18" y="28" font-size="18">📑</text>
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
        Pillar 3: Standards &amp; Docs
      </text>
      <text x="250" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">
        PASS [15]
      </text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">
        INDEX.md routing integrity, doc frontmatter
      </text>
    </g>
  </g>

  <!-- ==================== CENTER SHIELD SCORE CARD ==================== -->
  <g transform="translate(425, 125)">
    <rect width="250" height="230" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <!-- Top Glowing Bar -->
    <rect width="250" height="4" rx="2" fill="#34d399" />

    <text x="125" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">
      OVERALL HEALTH GRADE
    </text>

    <!-- Big Score Circle -->
    <circle cx="125" cy="100" r="48" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2.5" />
    <text x="125" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">
      90
    </text>
    <text x="125" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      GRADE A
    </text>

    <!-- Metric Pills Below Score -->
    <g transform="translate(25, 160)">
      <rect width="95" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="47" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">
        0 LLM TOKENS
      </text>

      <rect x="105" width="95" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="152" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">
        100% OFFLINE
      </text>
    </g>

    <text x="125" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">
      Heuristic AST + Regex Scan Engine
    </text>
  </g>

  <!-- ==================== RIGHT PILLARS (4, 5, 6, 7) ==================== -->
  <g transform="translate(750, 75)">
    <!-- Pillar 4 -->
    <g transform="translate(0, 0)">
      <rect width="300" height="66" rx="10" fill="url(#hcCardBg)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
      <rect width="4" height="66" rx="2" fill="#34d399" />
      <text x="18" y="26" font-size="16">🧪</text>
      <text x="46" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">
        Pillar 4: Testing &amp; Verification
      </text>
      <text x="250" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">
        PASS [15]
      </text>
      <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">
        Verification commands, pytest suite coverage
      </text>
    </g>

    <!-- Pillar 5 -->
    <g transform="translate(0, 80)">
      <rect width="300" height="66" rx="10" fill="url(#hcCardBg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" />
      <rect width="4" height="66" rx="2" fill="#f59e0b" />
      <text x="18" y="26" font-size="16">🤖</text>
      <text x="46" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">
        Pillar 5: Agent Constitution
      </text>
      <text x="250" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">
        PASS [10]
      </text>
      <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">
        AGENTS.md schema, rules, circuit breakers
      </text>
    </g>

    <!-- Pillar 6 -->
    <g transform="translate(0, 160)">
      <rect width="300" height="66" rx="10" fill="url(#hcCardBg)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
      <rect width="4" height="66" rx="2" fill="#6366f1" />
      <text x="18" y="26" font-size="16">🏛️</text>
      <text x="46" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">
        Pillar 6: Architecture &amp; ADRs
      </text>
      <text x="250" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">
        PASS [10]
      </text>
      <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">
        Pattern adherence, boundary separation (ARCH-*)
      </text>
    </g>

    <!-- Pillar 7 -->
    <g transform="translate(0, 240)">
      <rect width="300" height="66" rx="10" fill="url(#hcCardBg)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
      <rect width="4" height="66" rx="2" fill="#ec4899" />
      <text x="18" y="26" font-size="16">🛡️</text>
      <text x="46" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">
        Pillar 7: Anti-Prompt Injection
      </text>
      <text x="250" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">
        PASS [15]
      </text>
      <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">
        SAFE-001/002/003 regex gate, zero injection leaks
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM RUNTIME BAR ==================== -->
  <g transform="translate(50, 400)">
    <rect width="1000" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="24" r="5" fill="#10b981" />
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">
      Delivery: Single-EXE Executable (ADR-0022)
    </text>
    <text x="340" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">
      Embedded Core Engine • Zero Python Required • WinForms Desktop UI + Direct CLI Passthrough
    </text>
    <rect x="910" y="11" width="75" height="26" rx="6" fill="#065f46" />
    <text x="947" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle">
      READY
    </text>
  </g>
</svg>
