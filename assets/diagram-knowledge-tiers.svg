      </text>
    </g>

    <!-- Item List -->
    <g transform="translate(18, 75)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="279" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
          🏛️ 4 Patterns (Clean, Slice, Monolith)
        </text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 42)">
        <rect width="279" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
          ⚡ Curated 16+ MCP Server Matrix
        </text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 84)">
        <rect width="279" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
          🎯 Curated Agent Skills Matrix
        </text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 126)">
        <rect width="279" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
          🚦 Go-Live Checklist &amp; Anti-Doom-Loop
        </text>
      </g>
    </g>

    <!-- Bottom Pill -->
    <g transform="translate(18, 246)">
      <rect width="279" height="22" rx="5" fill="#4338ca" fill-opacity="0.25" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="139" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#c7d2fe" text-anchor="middle">
        PULL ONLY 1 PROFILE • ZERO BLOAT
      </text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: KNOWLEDGE LIBRARY ==================== -->
  <g transform="translate(750, 80)">
    <rect width="300" height="280" rx="14" fill="url(#tierPanelGrad)" stroke="#34d399" stroke-width="1.3" stroke-opacity="0.5" />
    <rect width="300" height="4" rx="2" fill="url(#neonEmerald)" />

    <!-- Header -->
    <g transform="translate(18, 22)">
      <circle cx="18" cy="18" r="18" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1" />
      <text x="18" y="24" font-size="18" text-anchor="middle">📖</text>
      <text x="46" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">
        Tier 3: Knowledge Library
      </text>
      <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">
        On-Demand Reference Only
      </text>
    </g>

    <!-- Item List -->
    <g transform="translate(18, 75)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="264" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
          💡 System Design Philosophy Playbooks
        </text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 42)">
        <rect width="264" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
          ⚡ Token Frugality &amp; Memory Bounds
        </text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 84)">
        <rect width="264" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
          📊 YC &amp; Sequoia 11-Slide Pitch Deck
        </text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 126)">
        <rect width="264" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
          🔄 Incident Recovery &amp; SRE Tactics
        </text>
      </g>
    </g>

    <!-- Bottom Pill -->
    <g transform="translate(18, 246)">
      <rect width="264" height="22" rx="5" fill="#065f46" fill-opacity="0.25" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="132" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">
        CONSULTED AS NEEDED • 0 INGESTION BLOAT
      </text>
    </g>
  </g>

  <!-- Bottom Context Budget Bar -->
  <g transform="translate(50, 385)">
    <rect width="1000" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="21" r="5" fill="#38bdf8" />
    <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">
      Strict Context Fencing Contract:
    </text>
    <text x="245" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">
      Core Baseline (~3.5k tokens) + Chosen Profile (~4k tokens) = Under 10k tokens total. 90% of Agent context remains free for user code!
    </text>
    <rect x="910" y="8" width="75" height="26" rx="6" fill="#0369a1" fill-opacity="0.4" />
    <text x="947" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" text-anchor="middle">
      &lt; 10k TOKENS
    </text>
  </g>
</svg>
