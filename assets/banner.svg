<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="450" fill="url(#bgGrad)" />
  <rect width="1200" height="450" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="280" fill="url(#glowCyan)" filter="url(#blurFilter)" />
  <circle cx="980" cy="160" r="320" fill="url(#glowIndigo)" filter="url(#blurFilter)" />
  <circle cx="600" cy="380" r="250" fill="url(#glowPink)" filter="url(#blurFilter)" />

  <!-- Top Decorative Tech Lines -->
  <line x1="100" y1="20" x2="1100" y2="20" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="8 6" />
  <circle cx="100" cy="20" r="3" fill="#38bdf8" />
  <circle cx="1100" cy="20" r="3" fill="#818cf8" />

  <!-- Badge Pill at Top -->
    <!-- Brand Logo Image (P Monogram) -->
    <!-- Brand Vector Logo Mark (P Monogram) -->
  <g transform="translate(565, 20) scale(0.14)" fill="url(#titleGrad)">
    <path d="M 198.48 78.38 L 186.56 85.54 L 128.45 146.03 L 123.68 157.06 L 123.68 223.52 L 126.96 225.90 L 136.79 223.52 L 210.40 149.61 L 231.86 140.07 L 308.45 140.07 L 318.28 144.84 L 323.95 155.57 L 323.95 232.16 L 319.18 246.46 L 237.82 330.80 L 238.12 337.06 L 241.40 340.34 L 306.07 340.34 L 322.75 333.19 L 380.87 275.07 L 383.25 265.24 L 388.02 259.28 L 388.02 123.68 L 385.64 122.49 L 383.25 110.27 L 376.10 98.35 L 363.28 85.54 L 342.72 76.00 L 204.74 76.00 L 203.55 78.38 Z" />
    <path d="M 272.69 183.28 L 270.01 183.28 L 267.92 180.90 L 253.32 180.90 L 251.23 183.28 L 243.78 183.28 L 241.70 185.67 L 234.25 188.05 L 229.77 192.82 L 227.09 192.82 L 133.22 286.70 L 133.22 289.38 L 128.45 293.85 L 128.45 296.53 L 125.77 299.51 L 126.07 303.68 L 123.68 304.87 L 123.68 433.32 L 125.47 433.62 L 126.07 435.70 L 132.92 435.70 L 133.81 433.32 L 136.79 433.32 L 178.22 391.89 L 178.22 389.21 L 182.99 384.74 L 182.69 380.57 L 185.37 377.59 L 185.37 372.52 L 187.75 370.44 L 187.75 334.38 L 190.14 332.29 L 190.14 324.84 L 192.52 322.75 L 192.52 317.69 L 197.29 313.22 L 197.29 310.54 L 273.58 234.54 L 273.58 231.86 L 280.74 220.24 L 280.74 212.79 L 283.12 210.70 L 283.12 196.10 L 280.74 194.01 L 280.74 191.33 Z" />
  </g>

  <!-- Badge Pill at Top -->
  <g transform="translate(600, 102)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="-165" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="1.5">
      ✦ THE UNIVERSAL AI-NATIVE DELIVERY FRAMEWORK
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-1">
      PROJECT STARTER KIT
    </text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
      Production-Grade Scaffolding for Humans &amp; Autonomous AI Coding Agents
    </text>
  </g>

  <!-- 4 Architecture Pillar Cards -->
  <g transform="translate(70, 225)">
    <!-- Card 1: Clean Architecture -->
    <g transform="translate(0, 0)">
      <rect width="245" height="110" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="20" y="34" font-size="20">🏛️</text>
      <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        Clean Architecture
      </text>
      <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">
        Domain-Driven Design (DDD)
      </text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">
        Decoupled 4-Layer Backend Core
      </text>
    </g>

    <!-- Card 2: Bulletproof React -->
    <g transform="translate(270, 0)">
      <rect width="245" height="110" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="20" y="34" font-size="20">⚡</text>
      <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        Bulletproof React
      </text>
      <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">
        Feature-Driven SPA with Vite
      </text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">
        TanStack Query + Zustand Store
      </text>
    </g>

    <!-- Card 3: Anti-Crash Standard -->
    <g transform="translate(540, 0)">
      <rect width="245" height="110" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="20" y="34" font-size="20">🛡️</text>
      <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        Anti-Crash Standard
      </text>
      <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">
        Zero Runtime Screen Crash
      </text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">
        Defensive Types &amp; Error Boundary
      </text>
    </g>

    <!-- Card 4: Pitch Deck & Diátaxis -->
    <g transform="translate(810, 0)">
      <rect width="245" height="110" rx="14" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="20" y="34" font-size="20">📊</text>
      <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        Pitch &amp; Diátaxis Docs
      </text>
      <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">
        YC &amp; Sequoia 11-Slide Deck
      </text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">
        4-Quadrant Industry Docs Standard
      </text>
    </g>
  </g>

  <!-- Bottom Tech Stack Tag Bar -->
  <g transform="translate(600, 400)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1.2">
      TYPESCRIPT  •  REACT 18  •  VITE  •  TAILWIND CSS  •  DOCKER  •  POSTGRESQL  •  MARP SLIDES  •  MIT LICENSE
    </text>
  </g>
</svg>
