name: 🐛 Báo Cáo Lỗi (Bug Report)
description: Báo cáo một lỗi hoặc hành vi không mong muốn trong hệ thống
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Cảm ơn bạn đã báo cáo lỗi! Vui lòng cung cấp chi tiết theo mẫu dưới đây.
  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      description: Tóm tắt rõ ràng về lỗi gặp phải.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Các bước tái hiện (Steps to Reproduce)
      description: 1. Làm gì... 2. Nhập gì... 3. Quan sát kết quả...
      placeholder: |
        1. Gọi endpoint /api/v1/...
        2. Gửi payload: {...}
        3. Nhận mã lỗi 500 thay vì 400
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hành vi mong muốn (Expected Behavior)
      description: Hệ thống đáng lẽ phải hoạt động như thế nào?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Môi trường (Environment)
      description: OS, Node/Python/.NET version, Browser...
      placeholder: "Windows 11, Node v20.10, Chrome 120"
    validations:
      required: false
