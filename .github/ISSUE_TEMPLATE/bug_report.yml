name: 🐛 Bug Report
description: Report an issue or unexpected behavior in the system
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please provide the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise summary of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Call endpoint /api/v1/...
        2. Send payload: {...}
        3. Observe 500 error instead of expected 400
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear explanation of what you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node/Python/.NET version, Browser...
      placeholder: "Windows 11, Python 3.12, Chrome 120"
    validations:
      required: false
