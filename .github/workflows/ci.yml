name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gate:
    name: Code Quality & Test Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Context Files Integrity
        run: |
          echo "Checking mandatory context and spec files..."
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -d specs || (echo "Missing specs directory" && exit 1)
          test -d adrs || (echo "Missing adrs directory" && exit 1)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Compile Python sources (syntax check)
        run: python -m compileall -q scripts

      - name: Run Python tests (Core Engine & Reviewer server)
        run: python -m pytest tests -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend type-check & build
        working-directory: frontend
        run: npm run build

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
