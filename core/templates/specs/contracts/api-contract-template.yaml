openapi: 3.0.3
info:
  title: Universal Project API Contract Template
  description: Standard API communication contract between Frontend and Backend
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /tasks:
    get:
      summary: List all tasks
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskItem'

components:
  schemas:
    TaskItem:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: string
          example: T-001
        title:
          type: string
          example: Setup project structure
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
          example: TODO
